main = ".open-next/worker.js"
name = "oh-my-cybersecurity-web"
# The Sisyphus Labs account (moved 2026-10-09, sisyphuslabs/common-infra docs/cutover-workers.md). The omc.nga.hm
# zone is Active there; routes resolve by zone name inside that authenticated account, so a deploy
# can never attach them to another account's zone.
account_id = "6511ce566bfe27228f536a8fb9448be5"
compatibility_date = "2026-05-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
routes = [
  { pattern = "omc.nga.hm/*", zone_name = "omc.nga.hm" },
  { pattern = "www.omc.nga.hm/*", zone_name = "omc.nga.hm" },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
